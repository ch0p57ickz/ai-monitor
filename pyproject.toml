[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-monitor"
version = "0.1.0"
description = "Cached provider usage service for GX10 (Codex, Antigravity, OpenRouter)."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ai-monitor = "ai_monitor.main:main"

[tool.setuptools.packages.find]
include = ["ai_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
